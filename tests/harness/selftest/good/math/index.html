<html lang="en"><head><meta charset="utf-8"><title>Maths — self-test</title>
<script>/* @myst-theme/site's BlockingThemeLoader: the saved choice, else the preference */
const saved = localStorage.getItem("myst:theme");
const pref = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.documentElement.classList.add(saved ?? pref);</script>
<style>body{margin:0;font:16px sans-serif} html.dark body{background:#1c1917;color:#ddd} article main{max-width:800px;margin:0 auto}
article main p{font-size:18px} .qe-collapse--input .qe-collapse__body{max-height:6em;overflow:hidden}
.qe-collapse--input[data-expanded="true"] .qe-collapse__body{max-height:none} pre{margin:0} .overflow-auto,.overflow-x-auto{overflow-x:auto}
/* KaTeX's styles, as mystmd serves them: the drawn HTML in KaTeX's fonts, its letters in KaTeX_Math, and the MathML
   copy clipped to a 1px box */
.katex{font:normal 1.21em KaTeX_Main,Times New Roman,serif;line-height:1.2;text-indent:0;text-rendering:auto}
.katex-display{display:block;margin:1em 0;text-align:center} .katex-display>.katex{display:block;text-align:center;white-space:nowrap}
.katex .katex-mathml{position:absolute;clip:rect(1px,1px,1px,1px);padding:0;border:0;height:1px;width:1px;overflow:hidden}
.katex .katex-html>.newline{display:block} .katex .base{position:relative;display:inline-block;white-space:nowrap}
.katex .strut{display:inline-block} .katex .mathnormal{font-family:KaTeX_Math;font-style:italic}
.katex .vlist-t{display:inline-table;table-layout:fixed;border-collapse:collapse} .katex .vlist-r{display:table-row}
.katex .vlist{display:table-cell;vertical-align:bottom;position:relative} .katex .vlist>span{display:block;height:0;position:relative}
.katex .vlist>span>span{display:inline-block} .katex .vlist-s{display:table-cell;vertical-align:bottom;font-size:1px;width:2px;min-width:2px}
.katex .pstrut{display:inline-block;overflow:hidden;width:0} .katex .mspace{display:inline-block}
.katex .sizing.reset-size6.size3{font-size:.7em}
/* the metrics (D19): each measured box pinned in px, so the expected metrics hold whatever the platform's fonts */
.katex-display{height:40px}</style></head>

<div class="prose-qetext-light"><p>A paragraph of lecture text, long enough to measure, with <a href="../">a link</a>, which costs $5 or $10.</p></div>

<script>/* a working toggle: switches the page and keeps the choice */
document.querySelector('button[aria-label="Change contrast"]').addEventListener("click", function () {
  const dark = !document.documentElement.classList.contains("dark");
  document.documentElement.classList.remove("light", "dark");
  document.documentElement.classList.add(dark ? "dark" : "light");
  localStorage.setItem("myst:theme", dark ? "dark" : "light");
});</script>
</body></html>
