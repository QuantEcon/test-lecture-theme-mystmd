<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Maths — self-test</title>
<script>/* @myst-theme/site's BlockingThemeLoader: the saved choice, else the preference */
const saved = localStorage.getItem("myst:theme");
const pref = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.documentElement.classList.add(saved ?? pref);</script>
<style>body{margin:0;font:16px sans-serif} html.dark body{background:#1c1917;color:#ddd} article main{max-width:800px;margin:0 auto}
article main p{font-size:18px} .qe-collapse--input .qe-collapse__body{max-height:6em;overflow:hidden}
.qe-collapse--input[data-expanded="true"] .qe-collapse__body{max-height:none} pre{margin:0} .overflow-auto,.overflow-x-auto{overflow-x:auto} .katex-mathml{position:absolute;clip:rect(1px,1px,1px,1px);width:1px;height:1px;overflow:hidden}</style></head>
<body>
<div><ul><li><button type="button" class="qe-toc-toggle" aria-label="Table of contents">toc</button></li>
<li><button aria-label="Change contrast">contrast</button></li></ul></div>
<article class="article content"><main>
<!-- maths as mystmd renders it at build (KaTeX 0.16.33): no delimiters reach the page, and the TeX in KaTeX's
     annotation is not read; a price in dollars and TeX in code are not maths left raw -->
<p>A paragraph of lecture text, long enough to measure, with <a href="../">a link</a>, which costs $5 or $10.</p>
<p>Inline <span><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">x^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>, written <code>$x^2$</code> or <code>\(x^2\)</code>.</p>
<div id="mean" class="flex my-5 group"><div class="flex-grow overflow-x-auto overflow-y-hidden"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mtable rowspacing="0.25em" columnalign="right left" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mi>a</mi></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mrow></mrow><mo>=</mo><mover accent="true"><mi>b</mi><mo>ˉ</mo></mover></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{aligned} a &amp;= \bar{b} \end{aligned}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.5em;vertical-align:-0.5em;"></span><span class="mord"><span class="mtable"><span class="col-align-r"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1em;"><span style="top:-3.16em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">a</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.5em;"><span></span></span></span></span></span><span class="col-align-l"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1em;"><span style="top:-3.16em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8312em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord mathnormal">b</span></span><span style="top:-3.2634em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.25em;"><span class="mord">ˉ</span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.5em;"><span></span></span></span></span></span></span></span></span></span></span></span></div></div>
<div class="myst-code relative group not-prose overflow-auto"><pre><code class="language-latex">$$\begin{aligned} a &amp;= \bar{b} \end{aligned}$$</code></pre></div>
</main></article>
<script>/* a working toggle: switches the page and keeps the choice */
document.querySelector('button[aria-label="Change contrast"]').addEventListener("click", function () {
  const dark = !document.documentElement.classList.contains("dark");
  document.documentElement.classList.remove("light", "dark");
  document.documentElement.classList.add(dark ? "dark" : "light");
  localStorage.setItem("myst:theme", dark ? "dark" : "light");
});</script>
</body></html>
