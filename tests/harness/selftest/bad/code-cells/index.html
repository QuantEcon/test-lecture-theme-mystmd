<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code cells — self-test</title>
<!-- page-meta wrong at any base, two ways. In light only the canonical link is wrong: it names another page. In dark
     the script at the end puts it right, names another page in og:url instead, and drops twitter:card -->
<link rel="canonical" href="https://quantecon.github.io{{base}}typography/">
<meta property="og:url" content="https://quantecon.github.io{{base}}code-cells/">
<meta property="og:title" content="Code cells">
<meta property="og:image" content="https://assets.quantecon.org/img/qe-og-logo.png">
<meta property="og:site_name" content="Self-test Lectures">
<meta name="twitter:card" content="summary">
<script>/* @myst-theme/site's BlockingThemeLoader: the saved choice, else the preference */
const saved = localStorage.getItem("myst:theme");
const pref = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
document.documentElement.classList.add(saved ?? pref);</script>
<style>body{margin:0;font:16px sans-serif} html.dark body{background:#1c1917;color:#ddd} article main{max-width:800px;margin:0 auto}
article main p{font-size:18px} .qe-collapse--input .qe-collapse__body{max-height:6em;overflow:hidden}
.qe-collapse--input[data-expanded="true"] .qe-collapse__body{max-height:none} pre{margin:0}
/* the metrics (D19): each measured box pinned in px, so the expected metrics hold whatever the platform's fonts */
.myst-jp-nb-block[id]{height:120px} article main h1{margin:0;height:40px;font-size:32px;line-height:40px}</style></head>
<body>
<div><ul><li><button type="button" class="qe-toc-toggle" aria-label="Table of contents">toc</button></li>
<li><button aria-label="Change contrast">contrast</button></li>
<li><button aria-label="Downloads">downloads</button></li></ul></div>
<article class="article content"><main>
<div><h1>Self-test Lectures, the title not linked</h1></div><!-- the metrics: the page's one paragraph is in no prose block, so it has no body text: the body measures are empty -->
<p>A paragraph of lecture text, long enough to measure, with <a href="../">a link</a>.</p><!-- the drawn counts: one cell, with the empty outputs container of a cell with no output -->
<div id="selftest-cell-1" class="myst-jp-nb-block relative group/block"><div class="myst-code relative group not-prose overflow-auto"><pre><code class="language-python">import numpy as np
x = np.linspace(0, 1, 5)</code></pre><button title="Copy to clipboard" aria-label="Copy code to clipboard" class="myst-code-copy-icon">copy</button></div><div data-name="outputs-container" class="max-w-full overflow-y-visible m-0 group not-prose relative text-left"></div></div><details class="qe-stderr" open><summary>Code warnings</summary><div><pre>UserWarning: this goes to stderr</pre></div></details>
</main></article>
<script>/* a dead copy button: the click copies nothing. And in dark, the page refuses clipboard writes, as a browser
   that denies the page the clipboard would, so the harness cannot put its marker there: the check is skip */
if (document.documentElement.classList.contains("dark")) {
  navigator.clipboard.writeText = function () { return Promise.reject(new DOMException("Write permission denied.", "NotAllowedError")); };
}</script>
<script>/* a broken toggle: the click does nothing */
document.querySelector('button[aria-label="Change contrast"]').addEventListener("click", function () {});</script>
<script>console.error("harness self-test: a console error on load");</script>
<script>/* in dark: the canonical link right, og:url naming another page, and no twitter:card */
if (document.documentElement.classList.contains("dark")) {
  var canonical = document.querySelector('link[rel="canonical"]'), og = document.querySelector('meta[property="og:url"]');
  canonical.setAttribute("href", og.getAttribute("content"));
  og.setAttribute("content", og.getAttribute("content").replace("code-cells/", "typography/"));
  document.querySelector('meta[name="twitter:card"]').remove();
}</script>
<script>/* the Downloads menu as theme v3.2.1 draws it: Radix menu items with no link, shown only while the menu is open,
   each fetching its file when selected and saving it through a hidden a[download] made for the moment. Both fetches answer 404, and each 404 page is saved under the file's name, as the theme saves it */
(function () {
  const files = [["Book (PDF)", "{{base}}build/missing.pdf", "book.pdf"], ["Notebook", "{{base}}build/missing.ipynb", "code_cells.ipynb"]];
  const button = document.querySelector('button[aria-label="Downloads"]');
  let menu = null;
  const shut = () => { if (menu) { menu.remove(); menu = null; } };
  button.addEventListener("click", () => {
    if (menu) return shut();
    menu = document.createElement("div");
    menu.setAttribute("role", "menu");
    for (const [title, url, name] of files) {
      const item = document.createElement("div");
      item.setAttribute("role", "menuitem");
      item.textContent = title;
      item.addEventListener("click", async () => {
        shut();
        const blob = await (await fetch(url)).blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.style.display = "none";
        document.body.append(a);
        a.click();
        a.remove();
      });
      menu.append(item);
    }
    document.body.append(menu);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") shut(); });
})();</script>
</body></html>
