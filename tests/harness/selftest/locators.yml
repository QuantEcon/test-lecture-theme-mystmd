# The self-test's locator table: the format of ../locators.yml, with twelve of its entries, each with this site's real
# locator (so the real behaviour in ../theme.mjs runs on the fixtures) except `font-size`, given a locator its behaviour
# cannot use. Two are null on this site, so the self-test sees features with no counterpart: `outline-copy-link`, and
# `notebook-header`, whose behaviour runs without one. The fixtures in good/ and bad/ are pages in this theme's markup.
source:
  repository: QuantEcon/project-theme-parity
  path: bin/site-features.yml
  commit: 530b6a80afa534d6935b8ee6d9243dc7df7e7ebd
  side: mystmd
features:
  - id: header-title
    name: "The book's title in the page header"
    page: code_cells
    viewport: desktop
    locator: '[aria-label="Book title"] a'
  - id: dark-mode
    name: "Dark mode, and whether the reader's choice persists"
    page: typography
    viewport: desktop
    locator:
      toggle: 'button[aria-label="Change contrast"]'
      dark: "html.dark"
    behaviour: "toggle; open another page; reload; then emulate a change of `prefers-color-scheme`"
  - id: dark-palette
    name: "The dark palette"
    page: typography
    viewport: desktop
    locator: "html.dark"
    behaviour: "in dark mode, record the page, text and link colours (#15's metrics)"
  - id: stderr-fold
    name: "Folded stderr output"
    page: code_cells
    viewport: desktop
    locator: "details.qe-stderr > summary"
    behaviour: "the stderr text is hidden on load; the toggle shows it"
  - id: page-meta
    name: "Canonical link, page title and social cards"
    page: code_cells
    viewport: desktop
    locator:
      canonical: 'link[rel="canonical"]'
      og: 'meta[property^="og:"]'
    behaviour: "the canonical URL and `og:url` equal the page's address"
  - id: code-copy
    name: "Copy buttons on code"
    page: code_cells
    viewport: desktop
    locator: ".myst-code button.myst-code-copy-icon"
    behaviour: "press it on a cell; the clipboard holds the cell's source"
  - id: download-notebook
    name: "Download the page's notebook"
    page: code_cells
    viewport: desktop
    locator:
      control: 'button[aria-label="Downloads"]'
      items: '[role="menu"] [role="menuitem"]'
    behaviour: "open the control where it is a menu, and fetch each link"
  - id: notebook-header
    name: "The notebook header"
    page: code_cells
    viewport: desktop
    locator: null
    behaviour: "download each stack's notebook for the page and compare its first cell"
  - id: download-pdf
    name: "A PDF of the page"
    page: code_cells
    viewport: desktop
    locator:
      control: 'button[aria-label="Downloads"]'
      pdf: '[role="menu"] [role="menuitem"]:has-text("PDF")'
    behaviour: "activate the control; Sphinx's opens a print dialog, mystmd's menu lists the PDF and its file answers 200"
  - id: outline-copy-link
    name: "Copy a section's link from the outline"
    page: typography
    viewport: wide
    locator: null
    behaviour: "activate it; the clipboard holds the page URL with the section's fragment"
  - id: long-input
    name: "Collapsed long inputs (`collapse-N`)"
    page: long_cells
    viewport: desktop
    locator: ".qe-collapse--input .qe-collapse__bar"
    behaviour: "the input's height is capped; the bar expands it to full height and collapses it again"
  - id: font-size
    name: "Text size controls"
    page: typography
    viewport: wide
    # one unnamed part, where the behaviour presses the part named `increase`: the behaviour throws (`error`), at
    # the `wide` viewport
    locator: "article main p"
    behaviour: "increase once: the text grows; the size holds on another page and after a reload"
