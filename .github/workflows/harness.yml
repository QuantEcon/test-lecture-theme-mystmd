# The rendered checks of the theme-parity harness (QuantEcon/project-theme-parity#15, decision D9): Playwright, in
# tests/harness/, against the site this run built, served under the path it was built for. ci.yml (and, in the
# Sphinx corpus, publish.yml) calls it after the build job, with the artefact that holds the built site.
#
# A failed check is a row of rendered.csv, not a red job. This job fails only when the harness itself does: the
# self-test reads its fixtures wrongly, the site cannot be served, the locator table does not parse, or a check
# could not run (an `error` row; the rows are still written). Its rows are uploaded as this run's `harness`
# artefact either way, and the deploy job puts them on the site, under /_harness/, only when this job succeeded.
#
# The same file in QuantEcon/test-lecture-theme-sphinx and QuantEcon/test-lecture-theme-mystmd.
name: Rendered checks
on:
  workflow_call:
    inputs:
      site-artifact:
        description: The name of this run's artefact that holds the built site
        type: string
        required: true
      base-path:
        description: The path the built site is served under, the one it was built for (`/name/`, or `/`)
        type: string
        required: true

jobs:
  rendered:
    name: Rendered checks (Playwright)
    # Outside the build image, which may lack Playwright's browser and its system libraries: the theme's DOM does not
    # depend on where the checks run, and the build it reads was made in the image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/harness
    steps:
      - uses: actions/checkout@v7

      # The engine is shared by copy (everything but theme.mjs, locators.yml and the fixtures), so it is compared with
      # the twin corpus's, read through the API with this job's token (raw.githubusercontent.com caches for minutes,
      # too long for a sweep's two pushes). Every file is read at one commit of the twin: on a pull request, the head
      # of its branch of the same name when there is one (a change to the engine lands as two pull requests, one in
      # each corpus, on one branch name), else the head of its main. The files compared are the union of the two
      # corpora's. A difference fails the job on a pull request; on a push it only warns, since one of a sweep's two
      # pull requests always merges first and the twin's main catches up when the other does. Only an answer of 404
      # means "not there": any other failed read (a rate limit, a 5xx, the network) is tried once more and then
      # reported as unread, which fails a pull request and warns on a push, like a difference.
      - name: The shared engine matches the twin corpus's
        working-directory: .
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          case "$GITHUB_REPOSITORY" in
            */test-lecture-theme-sphinx) twin="$owner/test-lecture-theme-mystmd" ;;
            */test-lecture-theme-mystmd) twin="$owner/test-lecture-theme-sphinx" ;;
            *) echo "::warning::$GITHUB_REPOSITORY is not one of the two corpora, so the engine is not compared"; exit 0 ;;
          esac
          # A finding fails a pull request and only warns on a push.
          report() { if [ "$EVENT" = pull_request ]; then echo "::error::$1"; exit 1; fi; echo "::warning::$1"; exit 0; }
          # api <out> <gh api arguments>: 0 read, 4 not there (404), 1 unread after two tries.
          api() {
            local out="$1" try; shift
            for try in 1 2; do
              if gh api --method GET "$@" > "$out" 2> "$RUNNER_TEMP/err"; then return 0; fi
              if grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then return 4; fi
              if [ "$try" = 1 ]; then sleep 5; fi
            done
            return 1
          }
          unread() { report "The shared engine could not be compared: reading $twin $1 failed twice ($(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-200))."; }
          ref=main; rc=0
          if [ -n "$HEAD_REF" ]; then
            api "$RUNNER_TEMP/sha" "repos/$twin/commits" -f sha="$HEAD_REF" -f per_page=1 --jq '.[0].sha' || rc=$?
            case "$rc" in 0) ref="$HEAD_REF" ;; 4) ;; *) unread "branch $HEAD_REF" ;; esac
          fi
          if [ "$ref" = main ]; then
            rc=0; api "$RUNNER_TEMP/sha" "repos/$twin/commits" -f sha=main -f per_page=1 --jq '.[0].sha' || rc=$?
            [ "$rc" = 0 ] || unread "main"
          fi
          sha=$(cat "$RUNNER_TEMP/sha")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || unread "$ref (it gave no commit)"
          rc=0; api "$RUNNER_TEMP/twin-lib" "repos/$twin/contents/tests/harness/lib" -f ref="$sha" --jq '.[].name' || rc=$?
          [ "$rc" = 0 ] || unread "tests/harness/lib at $sha"
          libs=$( { (cd tests/harness/lib && ls -1 -- *.mjs); grep '\.mjs$' "$RUNNER_TEMP/twin-lib" || true; } | sort -u)
          strip='del(.name, .packages."".name)'   # the package files differ in their names alone
          differ=()
          for f in .github/workflows/harness.yml tests/harness/run.mjs tests/harness/selftest/run.mjs \
                   $(printf 'tests/harness/lib/%s\n' $libs) tests/harness/package.json tests/harness/package-lock.json; do
            rc=0; api "$RUNNER_TEMP/twin" -H "Accept: application/vnd.github.raw" "repos/$twin/contents/$f" -f ref="$sha" || rc=$?
            case "$rc" in 0) ;; 4) differ+=("$f (not in the twin)"); continue ;; *) unread "$f at $sha" ;; esac
            if [ ! -f "$f" ]; then differ+=("$f (only in the twin)"); continue; fi
            case "$f" in
              *package.json|*package-lock.json) cmp -s <(jq -S "$strip" "$f") <(jq -S "$strip" "$RUNNER_TEMP/twin") || differ+=("$f") ;;
              *) cmp -s "$f" "$RUNNER_TEMP/twin" || differ+=("$f") ;;
            esac
          done
          if [ ${#differ[@]} -eq 0 ]; then echo "The shared engine matches $twin@$ref ($sha)."; exit 0; fi
          report "The shared engine differs from $twin@$ref ($sha) in: ${differ[*]}. Change both corpora, on one branch name."

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/harness/package-lock.json

      # @playwright/test is pinned by package-lock.json; `playwright install` fetches the Chromium build that version names
      - name: Install the harness and its browser
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.site-artifact }}
          path: ${{ runner.temp }}/site

      - name: Self-test (the fixtures in tests/harness/selftest/)
        run: npm run selftest

      - name: Rendered checks
        env:
          HARNESS_BASE_PATH: ${{ inputs.base-path }}
          # the pull request's head, not the merge commit GITHUB_SHA names on a pull request
          HARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node run.mjs --dir "$RUNNER_TEMP/site" --base-path "$HARNESS_BASE_PATH" --out "$GITHUB_WORKSPACE/_harness"

      - name: Upload the rows (_harness/)
        if: ${{ !cancelled() && hashFiles('_harness/rendered.csv') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: harness
          path: _harness/
          if-no-files-found: error
          retention-days: 30
